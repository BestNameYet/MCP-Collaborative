name: Dispatch Relay POST

on:
  workflow_dispatch:
  push:
    paths:
      - "Dispatch-Relay-Post/message.json"

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: POST message.json to ScriptAgent
        run: |
          curl --location --fail-with-body --show-error \
            --write-out "\nHTTP_STATUS=%{http_code}\nEFFECTIVE_URL=%{url_effective}\n" \
            --header "Content-Type: application/json" \
            --data-binary @Dispatch-Relay-Post/message.json \
            "https://script.google.com/macros/s/AKfycbwHE-BOtWz2ZFeD-XXBfqFVruBzC758HfgYLCc3o133gQr4ku5zBHEggvNc_bD0IdJFYw/exec"
